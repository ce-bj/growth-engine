<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI运营助手 Demo</title>
<script>
// React Refresh preamble - must run before any module scripts
window.$RefreshReg$ = function() {};
window.$RefreshSig$ = function() { return function(type) { return type; }; };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body,#root{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:#F5F7FA;overflow:hidden;height:100vh}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.chat-scroll::-webkit-scrollbar{width:5px}
.chat-scroll::-webkit-scrollbar-track{background:transparent}
.chat-scroll::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.chat-scroll::-webkit-scrollbar-thumb:hover{background:#94A3B8}
.chat-markdown p{margin:0.35em 0}
.chat-markdown h1,.chat-markdown h2,.chat-markdown h3,.chat-markdown h4{font-size:1.05em;font-weight:600;margin:0.65em 0 0.35em;line-height:1.4}
.chat-markdown h1:first-child,.chat-markdown h2:first-child,.chat-markdown h3:first-child{margin-top:0}
.chat-markdown ul,.chat-markdown ol{margin:0.35em 0;padding-left:1.25em}
.chat-markdown li{margin:0.2em 0}
.chat-markdown blockquote{margin:0.5em 0;padding:0.25em 0 0.25em 10px;border-left:3px solid #E2E8F0;color:#64748B}
.chat-markdown table{border-collapse:collapse;width:100%;margin:0.5em 0;font-size:12px}
.chat-markdown th,.chat-markdown td{border:1px solid #E2E8F0;padding:6px 8px;text-align:left}
.chat-markdown th{background:#F8FAFC;font-weight:600}
.chat-markdown code{font-family:'JetBrains Mono',monospace;font-size:0.9em;background:#F1F5F9;padding:1px 4px;border-radius:3px}
.chat-markdown pre{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:12px}
.chat-markdown pre code{background:transparent;padding:0}
.chat-markdown strong{font-weight:600}
.chat-markdown hr{border:none;border-top:1px solid #E2E8F0;margin:0.75em 0}
.topbar-nav{scrollbar-width:none}
.topbar-nav::-webkit-scrollbar{display:none;height:0}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
